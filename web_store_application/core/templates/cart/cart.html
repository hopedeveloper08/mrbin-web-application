{% load static %}
<div class="offcanvas offcanvas-end" tabindex="-1" id="cart">

    <!-- header -->
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bag-dash-fill" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M10.5 3.5a2.5 2.5 0 0 0-5 0V4h5zm1 0V4H15v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V4h3.5v-.5a3.5 3.5 0 1 1 7 0M6 9.5a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1z"/></svg>
            سبد خرید
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    
    <div class="offcanvas-body">
        
        {% if cart_items_count != 0 %}
        
            <!-- cart info -->
            {% include "cart/cart_info.html" %}
            
            <!-- cart items -->
            {% include "cart/cart_items.html" %}


        {% else %}
        
            <div class="alert alert-secondary text-center" role="alert">
                سبد شما خالی است
            </div>

        {% endif %}
        
    </div>
    
</div>
